name: Publish Retirement Horizons
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check && npm test
      - name: Assemble public app only
        run: |
          mkdir public
          cp index.html styles.css app.js model.js rules.js help.js worker.js sw.js manifest.webmanifest public/
          cp -r icons public/
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
# Date: 2026-10-06. Model: GPT-6. Prompt: Publish the generic local-only retirement PWA on GitHub Pages, excluding private financial information.
